# fly.toml — Fly.io deployment config for BTCognitive FastAPI backend

app = "btcognitive-engine"
primary_region = "sin"        # Singapore — closest to India for low latency

[build]
  dockerfile = "Dockerfile"

[env]
  PORT            = "8000"
  PYTHONUNBUFFERED = "1"
  BTC_ENVIRONMENT = "production"
  ENVIRONMENT     = "production"
  SQLITE_DB_PATH  = "/app/data/market_memory.db"
  MEIE_DB_PATH    = "/app/data/meie_memory.db"
  # Secrets (BTCOGNITIVE_ADMIN_KEY, SMTP_PASSWORD, etc.) are set via:
  #   fly secrets set BTCOGNITIVE_ADMIN_KEY="..."
  # NEVER put real secrets in this file.

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = false    # Keep always-on (no cold starts)
  auto_start_machines = true
  min_machines_running = 1       # At least 1 machine always running

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"               # Sufficient for FastAPI + sklearn/XGBoost
  cpu_kind = "shared"
  cpus     = 1

[checks]
  [checks.health]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 8000
    timeout      = "5s"
    type         = "http"

# Persistent Volume Storage:
# Mounts the persistent disk to /app/data where SQLITE_DB_PATH and ledgers reside.
# Must be created before initial deploy via:
#   fly volumes create btcognitive_data --region sin --size 1
[mounts]
  source = "btcognitive_data"
  destination = "/app/data"
