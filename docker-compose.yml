services:
  btcognitive-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btcognitive-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - BTC_ENVIRONMENT=production
      - ENVIRONMENT=production
      - SQLITE_DB_PATH=/app/experiments/results/market_memory.db
      - MEIE_DB_PATH=/app/experiments/results/meie_memory.db
    volumes:
      - ./data:/app/data
      - ./experiments/results:/app/experiments/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
