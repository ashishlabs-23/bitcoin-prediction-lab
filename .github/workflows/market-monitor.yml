name: BTCognitive market-monitor checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  market-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # The previous workflow installed only fastapi/httpx/pytest, but
      # tests/conftest.py imports backtest.market_memory, which imports numpy at
      # module scope. Collection therefore died with "ModuleNotFoundError:
      # numpy" before a single test ran -- the job has been red since 2026-10-23.
      #
      # The full requirements.txt pulls torch/xgboost/shap (~1 GB). The
      # market-monitor contract only needs the scientific core, so install that
      # explicitly and keep the job inside its time budget.
      - name: Install market-monitor test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.110" "httpx>=0.27" "pydantic>=2" "starlette" \
            "numpy>=1.26" "pandas>=2.0" "pyarrow>=14" "scikit-learn>=1.3" \
            "xgboost>=2.0" \
            "pytest>=8" "pytest-asyncio" "hypothesis" "jsonschema>=4"
          # torch is installed from the CPU wheel index: it is a declared
          # requirement, and models/challengers/microstructure_range.py imports
          # it at module scope, so tests/conftest.py cannot even load without it.
          # shap is left out -- engine/explainability.py imports it lazily.
      - name: Install torch (CPU wheels)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"

      - name: Verify the app imports
        run: python -c "import api.server; print('app import OK')"

      - name: Test market features and API contracts
        run: python -m pytest -q tests/test_market_drivers.py tests/test_market_monitor_routes.py

      # Pins the regressions fixed on 2026-11-28: dead readiness cache,
      # dashboard cache, path leakage, derivative error reasons, bounded limiter.
      - name: Test 2026-11-28 hardening regressions
        run: python -m pytest -q tests/test_hardening_2026_11_28.py

      # Regression batches added by the 2026-11-28 audit sprint. Every module
      # here is self-contained (synthetic frames or temp stores), so it needs no
      # gitignored dataset and runs fast on a hosted runner.
      - name: Test integrity, security and data-validation batches
        run: |
          python -m pytest -q \
            tests/test_integrity_batch_2026_11_28.py \
            tests/test_security_batch_2026_11_28.py \
            tests/test_data_validation_2026_11_28.py \
            tests/test_volatility_harness_guards_2026_11_28.py \
            tests/test_security_regressions.py \
            tests/test_route_authorization.py
