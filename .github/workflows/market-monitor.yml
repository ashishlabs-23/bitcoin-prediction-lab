name: BTCognitive CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_network_tests:
        description: 'Explicit opt-in to run live exchange network tests'
        required: false
        type: boolean
        default: false

jobs:
  backend-deterministic:
    name: Backend Deterministic Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt hypothesis
      - name: Run deterministic offline test suite
        run: |
          python -m pytest --junitxml=junit_report.xml -v
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: junit_report.xml

  frontend-verification:
    name: Frontend Syntax & Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend syntax check
        run: npm run check
      - name: Frontend unit & budget tests
        run: npm run test
      - name: Frontend production bundle build
        run: npm run build

  network-opt-in:
    name: Live Network & Exchange Integration (Opt-in)
    if: ${{ github.event.inputs.run_network_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run live exchange network tests
        run: |
          python -m pytest -m "network" -v
