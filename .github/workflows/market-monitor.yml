name: BTCognitive market-monitor checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  market-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitor test dependencies
        run: python -m pip install --upgrade pip fastapi "httpx>=0.27" pytest
      - name: Test market features and API contracts
        run: python -m pytest -q tests/test_market_drivers.py tests/test_market_monitor_routes.py
