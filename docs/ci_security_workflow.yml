# .github/workflows/security.yml — Security CI & Vulnerability Audit Workflow Template
# ======================================================================================
# Note: Add this file to your GitHub repository under .github/workflows/security.yml
# once your Personal Access Token has the 'workflow' scope enabled.

name: Security CI & Vulnerability Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Security Integration & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit

      - name: Run Security Integration Tests
        run: |
          python -m pytest tests/test_security_auth.py tests/test_security_validators.py tests/test_security_headers.py tests/test_api_attack_surface.py tests/test_route_authorization.py tests/test_websocket_security.py tests/test_secret_exposure.py tests/test_database_security.py tests/test_deployment_config.py tests/test_static_exposure.py tests/test_rate_limit_scope.py tests/test_secret_environment.py -v

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit --desc on || echo "Dependency vulnerability check completed."
