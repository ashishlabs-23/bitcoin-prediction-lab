name: BTCognitive Institutional CI Pipeline

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:
    branches:
      - main
      - "milestone/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend Contracts & Full Python Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Frontend Build & Smoke Verification
        run: |
          node build_frontend.js
          node tests_frontend.js

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt

      - name: Execute Full Regression Runner (Platform, Econometric, Strategy)
        env:
          PYTHONPATH: "."
          BTC_DATA_MODE: "fixture"
        run: |
          python scripts/run_full_regression.py --category platform,econometric,strategy

      - name: Audit Output Artifacts
        if: always()
        run: |
          cat artifacts/v35_3_regression_summary.json || true
